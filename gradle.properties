org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false
org.gradle.parallel=true

# The sighs maven host also publishes AAAA records that are unreachable on some
# networks, and Gradle then fails to resolve ApricityUI with "Connection reset".
# (Moved here from the old neoforge-1.21.1 target properties.)
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Version nodes keep their version-specific sources under versions/<node>/src;
# the cross-version files shared by all nodes live in the root src/ (11 files,
# `//?` Stonecutter preprocessing) and are materialized into each node by
# stonecutterGenerate during build. The sync-time auto-request stays disabled:
# it avoids a task-path resolution failure during IDE sync.
dev.kikugie.stonecutter.generate_sources_on_sync=false

# Shared publishing project IDs. Set these locally, or supply the matching
# CURSEFORGE_PROJECT_ID and MODRINTH_PROJECT_ID environment variables.
publish_curseforge_project_id=1725973
# publish_modrinth_project_id=
