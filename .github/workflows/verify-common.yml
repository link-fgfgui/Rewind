name: Verify Common Changes

on:
  push:
    paths:
      - 'common/**'
      - 'versions/**'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'stonecutter.properties.toml'
      - 'build.*.gradle.kts'
      - 'buildSrc/**'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/verify-common.yml'
  pull_request:
    paths:
      - 'common/**'
      - 'versions/**'
      - 'settings.gradle.kts'
      - 'stonecutter.gradle.kts'
      - 'stonecutter.properties.toml'
      - 'build.*.gradle.kts'
      - 'buildSrc/**'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/verify-common.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-common-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  common-tests:
    name: Common Unit Tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run common unit tests
        shell: pwsh
        run: .\gradlew.bat :common:test --console plain --no-daemon

  version-builds:
    name: Version Builds (all Stonecutter nodes)
    needs: [common-tests]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all versions
        shell: pwsh
        # Stonecutter builds every versions/<node> plus :common.
        # JDK 17/21/25 compile toolchains are auto-provisioned.
        run: .\gradlew.bat build --console plain --no-daemon
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-jars
          path: versions/*/build/libs/*.jar
          if-no-files-found: ignore
